<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hug Day Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">A Hug For You, Chrish 💜</h1>
        <div class="hug-animation">
            <img src="teddy_bear.png" alt="Teddy Bear" class="teddy">
        </div>
        <div class="hearts">
            <img src="floating_hearts.png" alt="Floating Hearts">
        </div>
        <p class="love-message">"I'm always here to hug you, no matter the distance." - Vinay 💜</p>
        <div class="handwritten-message">
            <p id="love-letter">💌</p>
        </div>
    </div>
    <audio id="bg-music" loop>
        <source src="gravity_OST.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
    <audio id="teddy-sound">
        <source src="teddy_sound_effect.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <script src="script.js"></script>
</body>
</html>
